<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri & Projeler - Perseus TMC</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .gallery-page-container { max-width: 1200px; margin: 3rem auto 6rem; padding: 0 1.5rem; }
    
    .media-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .media-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

    .media-preview-wrapper {
      position: relative;
      width: 100%;
      height: 230px;
      background: #0f172a;
      overflow: hidden;
    }

    .media-preview-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .badge-video-icon {
      position: absolute; top: 12px; right: 12px;
      background: rgba(15, 23, 42, 0.75); color: #fff;
      padding: 0.3rem 0.6rem; border-radius: 8px; font-size: 0.75rem; font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .media-card-body { padding: 1.2rem 1.5rem; }
    .media-card-body h3 { font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-bottom: 0.4rem; }
    .media-card-body p { color: #64748b; font-size: 0.88rem; line-height: 1.4; }
    .media-card-date { font-size: 0.75rem; color: #2563eb; font-weight: 700; margin-top: 0.8rem; }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }

    .lightbox-content-box {
      max-width: 900px; width: 100%; background: #ffffff; border-radius: 24px;
      overflow: hidden; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }

    .lightbox-media-container { width: 100%; max-height: 550px; background: #000; display: flex; justify-content: center; align-items: center; }
    .lightbox-media-container img, .lightbox-media-container video, .lightbox-media-container iframe {
      max-width: 100%; max-height: 550px; object-fit: contain; width: 100%; border: none;
    }

    .lightbox-info { padding: 1.5rem 2rem; }
    .lightbox-info h2 { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 0.4rem; }
    .lightbox-close-btn {
      position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.8);
      border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
      font-weight: 800; cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <div class="hero-glow"></div>

  <nav class="navbar">
    <div class="logo">Perseus TMC <span>Galeri</span></div>
    <ul class="nav-links">
      <li><a href="../">← Ana Sayfaya Dön</a></li>
    </ul>
  </nav>

  <div class="gallery-page-container">
    <div class="section-header" style="text-align: left; margin-bottom: 2.5rem;">
      <span class="section-badge">GÖRSELLER & VİDEOLAR</span>
      <h2>Sunucu Medya Arşivi</h2>
      <p class="section-sub">Perseus topluluğunun paylaştığı görseller ve video içerikleri (Kronolojik sıralı).</p>
    </div>

    <div class="gallery-grid" id="fullGalleryGrid">
      <p style="color:#94a3b8; grid-column:span 3; text-align:center;">Medya arşivi yükleniyor...</p>
    </div>
  </div>

  <div id="lightboxModal" class="lightbox-modal" style="display: none;">
    <div class="lightbox-content-box" onclick="event.stopPropagation()">
      <button class="lightbox-close-btn" id="btnCloseLightbox">✕</button>
      <div id="lightboxMedia" class="lightbox-media-container"></div>
      <div class="lightbox-info">
        <h2 id="lightboxTitle">Başlık</h2>
        <p id="lightboxDesc" style="color: #64748b; font-size: 0.95rem;"></p>
        <div id="lightboxDate" style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.5rem; font-weight: 600;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCc8-jBAz-1JtfMCPTeAIxyeYoMFfxT0Tw",
      authDomain: "ptech-website-150c5.firebaseapp.com",
      projectId: "ptech-website-150c5",
      storageBucket: "ptech-website-150c5.firebasestorage.app",
      messagingSenderId: "537877075508",
      appId: "1:537877075508:web:29af9a556dfb2425cddc61"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let galleryItems = [];

    function getYoutubeThumbnail(url) {
      if (!url) return null;
      let videoId = null;
      if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('v=')[1]?.split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
      } else if (url.includes('youtube.com/embed/')) {
        videoId = url.split('embed/')[1]?.split('?')[0];
      }
      return videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : null;
    }

    async function loadFullGallery() {
      const container = document.getElementById("fullGalleryGrid");
      try {
        const snap = await getDocs(collection(db, "gallery"));
        container.innerHTML = "";

        if (snap.empty) {
          container.innerHTML = '<p style="color:#94a3b8; grid-column:span 3; text-align:center;">Henüz galeriye medya eklenmedi.</p>';
          return;
        }

        galleryItems = [];
        snap.forEach(docSnap => galleryItems.push({ id: docSnap.id, ...docSnap.data() }));

        galleryItems.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        galleryItems.forEach((item, index) => {
          const isVideo = item.type === 'video';
          let thumbUrl = item.thumbnail || (isVideo ? getYoutubeThumbnail(item.url) : item.url);

          const badge = isVideo ? `<div class="badge-video-icon">▶ Video</div>` : '';

          const card = document.createElement("div");
          card.className = "media-card";
          card.innerHTML = `
            <div class="media-preview-wrapper">
              ${badge}
              <img src="${thumbUrl}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'">
            </div>
            <div class="media-card-body">
              <h3>${item.title}</h3>
              <p>${item.desc || ''}</p>
              <div class="media-card-date">📅 ${item.date || ''}</div>
            </div>
          `;
          card.addEventListener("click", () => openLightbox(index));
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<p style="color:red; grid-column:span 3; text-align:center;">Hata oluştu: ${e.message}</p>`;
      }
    }

    function openLightbox(index) {
      const item = galleryItems[index];
      if (!item) return;

      document.getElementById("lightboxTitle").innerText = item.title;
      document.getElementById("lightboxDesc").innerText = item.desc || '';
      document.getElementById("lightboxDate").innerText = item.date ? `Tarih: ${item.date}` : '';
      
      const mediaBox = document.getElementById("lightboxMedia");
      
      if (item.type === 'video') {
        if (item.url.includes('youtube.com') || item.url.includes('youtu.be')) {
          let embedUrl = item.url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
          mediaBox.innerHTML = `<iframe src="${embedUrl}?autoplay=1" allowfullscreen style="width:100%; height:450px;"></iframe>`;
        } else {
          mediaBox.innerHTML = `<video src="${item.url}" controls autoplay style="width:100%; max-height:450px;"></video>`;
        }
      } else {
        mediaBox.innerHTML = `<img src="${item.url}" alt="${item.title}">`;
      }

      document.getElementById("lightboxModal").style.display = "flex";
    }

    document.getElementById("btnCloseLightbox").addEventListener("click", () => {
      document.getElementById("lightboxModal").style.display = "none";
      document.getElementById("lightboxMedia").innerHTML = "";
    });

    document.addEventListener("DOMContentLoaded", loadFullGallery);
  </script>
</body>
</html>
